<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/assets/style.css">
<style>
  .body { margin-top: 84px; flex: 1; display: flex; flex-direction: column; }
  .chart {
    margin-top: 46px; padding: 38px 40px 30px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
    background: rgba(255,255,255,.035);
  }
  .chart-legend { display: flex; gap: 30px; margin-bottom: 26px; }
  .lg { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: rgba(255,255,255,.6); letter-spacing: .06em; }
  .lg i { width: 22px; height: 3px; border-radius: 2px; display: block; }
  .rowline { display: flex; gap: 18px; margin-top: 34px; }
  .bb { flex: 1; padding: 26px 28px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
  .bb .bbk { font-family:'JetBrains Mono',monospace; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: 10px; }
  .bb .bbv { font-size: 26px; font-weight: 700; line-height: 1.3; color: #fff; }
</style>
</head>
<body>
<div class="slide dark">
  <div class="inner">
    <div class="top">
      <div class="mark"><div class="glyph">C</div><div class="word">Cipta<em>Coding</em></div></div>
      <div class="meta">04 / 07</div>
    </div>

    <div class="body">
      <div class="eyebrow">Hitungan</div>
      <h2 class="head" style="margin-top:26px">Biaya 5 tahun:<br><span class="accent">angka yang jujur</span></h2>

      <div class="chart">
        <div class="chart-legend">
          <div class="lg"><i style="background:#ef4444"></i>SaaS</div>
          <div class="lg"><i style="background:#38bdf8"></i>Custom</div>
        </div>

        <svg viewBox="0 0 800 300" width="100%" height="300">
          <!-- grid -->
          <g stroke="rgba(255,255,255,.08)" stroke-width="1">
            <line x1="0" y1="250" x2="800" y2="250"/>
            <line x1="0" y1="180" x2="800" y2="180"/>
            <line x1="0" y1="110" x2="800" y2="110"/>
            <line x1="0" y1="40"  x2="800" y2="40"/>
          </g>
          <!-- SaaS compounding curve -->
          <path d="M0 235 C 140 232, 260 222, 380 200 S 620 130, 800 34"
                fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
          <!-- Custom: high start, plateau -->
          <path d="M0 250 L 90 120 C 220 104, 380 96, 800 84"
                fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
          <!-- crossing marker -->
          <circle cx="470" cy="157" r="9" fill="#071850" stroke="#38bdf8" stroke-width="4"/>
          <text x="470" y="128" fill="#38bdf8" font-family="JetBrains Mono" font-size="16" text-anchor="middle">titik impas</text>
        </svg>

        <div style="display:flex;justify-content:space-between;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:15px;color:rgba(255,255,255,.4)">
          <span>Tahun 1</span><span>2</span><span>3</span><span>4</span><span>Tahun 5</span>
        </div>
      </div>

      <div class="rowline">
        <div class="bb"><div class="bbk">SaaS · 5 tahun</div><div class="bbv" style="color:#fca5a5">≈ Rp 288 juta</div></div>
        <div class="bb"><div class="bbk">Custom · 5 tahun</div><div class="bbv" style="color:#7dd3fc">≈ Rp 165 juta</div></div>
      </div>
    </div>

    <div class="bottom">
      <div class="handle">@ciptacoding</div>
      <div class="dots"><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div>
    </div>
  </div>
</div>
</body>
</html>
